name: Data-Only CI Status

on:
  push:
    branches-ignore: [main]
    paths:
      - 'data/maps/**'
      - 'data/validation/**'
      - 'data/maps/dev_snapshots/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/maps/**'
      - 'data/validation/**'
      - 'data/maps/dev_snapshots/**'

permissions:
  contents: read

jobs:
  data_only_status:
    name: ci / All Checks Passed
    runs-on: ubuntu-latest
    steps:
      - name: Data-only change
        run: echo "Data-only change detected; skipping full CI."
