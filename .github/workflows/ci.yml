name: CI

on:
  push:
    branches: [main, 'release-please--*']
    # Skip CI for data-only changes (maps, validation files)
    # These are authored content, not code changes
    paths-ignore:
      - 'data/maps/**'
      - 'data/validation/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/maps/**'
      - 'data/validation/**'
  workflow_dispatch:  # Allow manual/automated triggering
  workflow_call:  # Allow being called by other workflows

jobs:
  ci:
    uses: pipe-works/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      python-version: '3.12'
      coverage-threshold: 25
      run-security: true
      run-docs: true
    secrets: inherit
